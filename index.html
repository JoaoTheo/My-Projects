<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrossel de Imagens</title>
    <link rel="stylesheet" href="style.css">
    <script src="scripts.js"></script>
</head>

<body>
    <div class="carrossel">
        <div class="carrossel-container">
            <div class="carrossel-item">
                <img src="/imagens/imagem1.jpg" alt="Imagem 1">
            </div>
            <div class="carrossel-item">
                <img src="/imagens/imagem2.jpg" alt="Imagem 2">
            </div>
            <div class="carrossel-item">
                <img src="/imagens/imagem1.jpg" alt="Imagem 3">
            </div>
            <!-- Adicione mais imagens conforme necessário -->
        </div>
        <button class="carrossel-btn prev" onclick="moverCarrossel(-1)">&#10094;</button>
        <button class="carrossel-btn next" onclick="moverCarrossel(1)">&#10095;</button>
    </div>
</body>

</html>
